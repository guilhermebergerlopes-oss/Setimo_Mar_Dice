<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>7º Mar Rolagem</title>
  </head>
  <body>
    <div id="app">
      <h3>Rolagem 7º Mar 2E</h3>
      
      <div class="form-group">
        <label>Dados (d10):</label>
        <input type="number" id="dicePool" value="5" min="1" max="30" style="width: 50px;" />
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="explodingDice" checked />
        <label for="explodingDice">Dados Explosivos (10 rola de novo)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="dangerPoint" />
        <label for="dangerPoint"><strong>Ponto de Perigo</strong> (Dificuldade +5)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="doubleRaiseAdvantage" />
        <label for="doubleRaiseAdvantage">15 rende <strong>2 Apostas</strong></label>
      </div>

      <button id="rollButton">Rolar Dados</button>
      <button id="clearButton" style="margin-top: 5px; background-color: #f5f5f5; color: #333; border: 1px solid #ccc;">Limpar</button>

      <div id="results"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
